<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" width="600" height="220">
  <defs>
    <linearGradient id="mark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Logo mark box -->
  <rect x="40" y="55" width="90" height="90" rx="24" fill="url(#mark-grad)"/>
  <polygon points="70,80 70,120 106,100" fill="#fff"/>
  <path d="M111,86 A18 18 0 0 1 111,114" stroke="rgba(255,255,255,.85)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M121,76 A31 31 0 0 1 121,124" stroke="rgba(255,255,255,.5)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- FlixTV wordmark -->
  <text x="150" y="120"
    font-family="'Syne','Arial Black',sans-serif"
    font-size="62"
    font-weight="800"
    fill="#0f172a"
    letter-spacing="-2">Flix<tspan fill="#3b82f6">TV</tspan></text>

  <!-- Tagline -->
  <text x="151" y="150"
    font-family="'DM Sans','Arial',sans-serif"
    font-size="18"
    font-weight="500"
    fill="#0f172a">Listen and watch for less 😉</text>
</svg>
